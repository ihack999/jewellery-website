# Netlify builds the storefront from /store on every deploy.
# Simple redirects live in store/site.json → "redirects" (written to dist/_redirects).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/lib/catalog.json"]

# Old product.html?slug=… links from the first version of the site.
[[redirects]]
  from = "/product.html"
  to = "/products/rare-blue-diamond-ring/"
  status = 301
  force = true
  query = { slug = "pear-halo-ring" }

[[redirects]]
  from = "/product.html"
  to = "/products/diamond-tennis-necklace/"
  status = 301
  force = true
  query = { slug = "diamond-tennis-necklace" }

[[redirects]]
  from = "/product.html"
  to = "/products/diamond-tennis-bracelet/"
  status = 301
  force = true
  query = { slug = "diamond-bracelet-stack" }

[[redirects]]
  from = "/product.html"
  to = "/products/yellow-diamond-oval-stud-earrings/"
  status = 301
  force = true
  query = { slug = "vintage-halo-stud-earrings" }

[[redirects]]
  from = "/product.html"
  to = "/products/diamond-hand-chain-bracelet/"
  status = 301
  force = true
  query = { slug = "gold-bezel-hand-chain" }

[[redirects]]
  from = "/product.html"
  to = "/products/cushion-cut-diamond-ring/"
  status = 301
  force = true
  query = { slug = "cushion-diamond-ring" }

[[redirects]]
  from = "/product.html"
  to = "/shop/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Content-hashed files: safe to cache forever.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/order/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wishlist/*"
  [headers.values]
    X-Robots-Tag = "noindex"
